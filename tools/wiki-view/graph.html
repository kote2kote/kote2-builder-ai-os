<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge Cosmos — Wiki</title>
<!-- ============================================================
  tools/wiki-view/graph.html — ワークスペースの Wiki の 3D グラフ（kote2 Builder AI OS の本体。OS の更新で配る）
  - kote2 Builder v3 の 3D 知識グラフ（templates/wiki/graph.html）を写して、OS の Wiki の項目に合わせたもの
  - index.html と同じ ./index.json を読み、related（ページの中のリンク・v3 の related・案件のレシピ）を 3D の力学グラフで描く（表示専用・何も書かない）
  - three.js は CDN(jsdelivr・版と中身を固定)から読む。読めない環境(オフライン / WebGL 無し)は index.html#/graph の 2D に案内する
  - 見どころ: 知識の誕生順リプレイ(Space)/ 種類で集める(G)/ シネマ(C = 録画向けの自動巡回)/ ノードをつかんで引っぱる
============================================================ -->
<style>
  :root {
    --bg:#03060b; --text:#e8f1f8; --sub:#8a9bab; --line:rgba(150,200,230,.16); --glass:rgba(10,18,28,.62);
    --knowledge:#5ee0ff; --troubleshooting:#ffbe3d; --decisions:#7c9dff; --patterns:#45f0a8; --sources:#b58bff; --projects:#ff6b8b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif; font-size:14px; -webkit-font-smoothing:antialiased; }
  #stage { position:fixed; inset:0; touch-action:none; }
  #stage canvas { display:block; width:100%; height:100%; }
  button,input { font:inherit; color:inherit; }
  a { color:var(--knowledge); }
  .glass { background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%); border-radius:14px; }
  /* HUD */
  .hud { position:fixed; z-index:5; transition:opacity .6s, transform .6s; }
  #brand { top:18px; left:20px; padding:12px 16px; }
  #brand .k { font-size:11px; letter-spacing:.32em; color:var(--sub); font-weight:600; }
  #brand h1 { font-size:20px; font-weight:800; letter-spacing:.04em; line-height:1.3; background:linear-gradient(90deg,#fff,#9fe8ff 55%,#c3a8ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #brand .stats { font-size:12px; color:var(--sub); margin-top:3px; font-feature-settings:"tnum"; }
  #brand .warn { font-size:11.5px; color:#ffcf6b; margin-top:6px; line-height:1.6; max-width:330px; }
  #top, #origin, #kind, #topic { background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:10px; color:var(--text); font:inherit; font-size:12.5px; font-weight:700; padding:6px 8px; cursor:pointer; max-width:100%; }
  #top option, #origin option, #kind option, #topic option { background:#0b1118; }
  #brand .stats b { color:var(--text); font-weight:700; }
  #tools { top:18px; right:20px; display:flex; gap:8px; align-items:center; padding:8px; flex-wrap:wrap; justify-content:flex-end; max-width:calc(100vw - 360px); }
  .b { border:1px solid var(--line); background:rgba(255,255,255,.04); border-radius:10px; padding:7px 12px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; text-decoration:none; color:var(--text); display:inline-flex; gap:6px; align-items:center; transition:background .2s,border-color .2s,box-shadow .2s; }
  .b:hover { background:rgba(255,255,255,.1); }
  .b.on { border-color:rgba(94,224,255,.7); box-shadow:0 0 18px rgba(94,224,255,.35) inset, 0 0 14px rgba(94,224,255,.25); }
  .b kbd { font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:var(--sub); border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  #search { position:relative; }
  #search input { width:clamp(150px, 15vw, 250px); background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:10px; padding:7px 12px 7px 30px; font-size:13px; outline:none; transition:border-color .2s, box-shadow .2s, width .3s; }
  #search input:focus { border-color:rgba(94,224,255,.6); box-shadow:0 0 16px rgba(94,224,255,.25); width:clamp(220px, 20vw, 300px); }
  #search::before { content:"⌕"; position:absolute; left:10px; top:50%; transform:translateY(-52%); color:var(--sub); font-size:15px; pointer-events:none; }
  #search .n { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--sub); pointer-events:none; }
  #legend { left:20px; bottom:18px; display:flex; flex-wrap:wrap; gap:6px; padding:8px; max-width:calc(100vw - 40px); }
  #legend button { border:1px solid transparent; background:none; border-radius:99px; padding:4px 10px 4px 8px; font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; color:var(--text); transition:opacity .2s, background .2s; }
  #legend button:hover { background:rgba(255,255,255,.07); }
  #legend button.off { opacity:.35; }
  #legend i { width:9px; height:9px; border-radius:50%; box-shadow:0 0 10px currentColor; background:currentColor; }
  #legend .c { color:var(--sub); font-size:11px; font-feature-settings:"tnum"; }
  #hint { right:20px; bottom:18px; font-size:11.5px; color:var(--sub); padding:9px 13px; line-height:1.7; text-align:right; }
  #hint b { color:var(--text); font-weight:600; }
  /* 詳細パネル */
  #panel { top:96px; right:20px; width:360px; max-height:calc(100vh - 170px); overflow-y:auto; padding:18px 18px 16px; transform:translateX(calc(100% + 40px)); opacity:0; pointer-events:none; }
  #panel.on { transform:none; opacity:1; pointer-events:auto; }
  #panel .x { position:absolute; top:10px; right:10px; background:none; border:0; color:var(--sub); font-size:18px; cursor:pointer; width:28px; height:28px; border-radius:8px; }
  #panel .x:hover { background:rgba(255,255,255,.08); color:var(--text); }
  #panel .shelf { font-size:11px; letter-spacing:.14em; font-weight:700; display:flex; align-items:center; gap:7px; }
  #panel .shelf i { width:8px; height:8px; border-radius:50%; background:currentColor; box-shadow:0 0 10px currentColor; }
  #panel h2 { font-size:17px; line-height:1.5; margin:8px 24px 6px 0; font-weight:800; }
  #panel .sum { font-size:13px; color:#b9c6d2; line-height:1.75; }
  #panel .meta { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; font-size:11.5px; }
  #panel .meta span { border:1px solid var(--line); border-radius:99px; padding:1px 9px; color:var(--sub); font-feature-settings:"tnum"; }
  #panel .meta .st { color:var(--text); }
  #panel h3 { font-size:11px; letter-spacing:.14em; color:var(--sub); font-weight:700; margin:14px 0 6px; }
  #panel ul { list-style:none; display:flex; flex-direction:column; gap:2px; }
  #panel li button { width:100%; text-align:left; background:none; border:0; border-radius:8px; padding:6px 8px; font-size:12.5px; line-height:1.5; cursor:pointer; display:flex; gap:8px; align-items:baseline; }
  #panel li button:hover { background:rgba(255,255,255,.07); }
  #panel li i { flex:none; width:7px; height:7px; border-radius:50%; background:currentColor; transform:translateY(-1px); }
  #panel li small { margin-left:auto; color:var(--sub); font-size:10.5px; white-space:nowrap; }
  #panel .tags { display:flex; flex-wrap:wrap; gap:5px; }
  #panel .tags span { font-size:11px; color:var(--sub); background:rgba(255,255,255,.05); border-radius:99px; padding:1px 8px; }
  #panel .acts { display:flex; gap:8px; margin-top:16px; }
  #panel .acts .b.primary { background:linear-gradient(90deg,rgba(94,224,255,.25),rgba(181,139,255,.25)); border-color:rgba(94,224,255,.5); }
  /* ラベル(3D の点に追従する HTML) */
  #labels { position:fixed; inset:0; pointer-events:none; z-index:3; overflow:hidden; }
  .lb { position:absolute; left:0; top:0; white-space:nowrap; font-size:12px; font-weight:650; color:#eaf6ff; text-shadow:0 0 6px #000,0 0 12px rgba(0,0,0,.9); will-change:transform,opacity; transform-origin:50% 0; }
  .lb.main { font-size:14.5px; font-weight:800; }
  .lb.born { font-size:13.5px; color:#fff; }
  .shelf-lb { position:absolute; left:0; top:0; font-size:12px; letter-spacing:.36em; font-weight:800; opacity:0; transition:opacity .8s; text-shadow:0 0 14px currentColor; }
  body.cluster .shelf-lb { opacity:.85; }
  /* 成長リプレイ */
  #timeline { left:50%; bottom:70px; transform:translate(-50%,20px); opacity:0; pointer-events:none; text-align:center; padding:14px 26px 16px; min-width:300px; }
  #timeline.on { opacity:1; transform:translate(-50%,0); }
  #timeline .k { font-size:10.5px; letter-spacing:.34em; color:var(--sub); font-weight:700; }
  #timeline .date { font-size:34px; font-weight:800; letter-spacing:.04em; font-feature-settings:"tnum"; line-height:1.3; background:linear-gradient(90deg,#fff,#9fe8ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #timeline .count { font-size:12.5px; color:var(--sub); font-feature-settings:"tnum"; }
  #timeline .bar { height:3px; border-radius:3px; background:rgba(255,255,255,.1); margin-top:10px; overflow:hidden; }
  #timeline .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--knowledge),var(--sources)); box-shadow:0 0 12px var(--knowledge); }
  /* シネマ(録画向け。UI を消して自動巡回) */
  #caption { left:44px; bottom:56px; max-width:min(620px,calc(100vw - 88px)); opacity:0; transform:translateY(12px); pointer-events:none; }
  #caption.on { opacity:1; transform:none; }
  #caption .shelf { font-size:12px; letter-spacing:.3em; font-weight:800; }
  #caption .t { font-size:clamp(22px,3.2vw,38px); font-weight:900; line-height:1.35; margin:6px 0 8px; text-shadow:0 0 30px rgba(0,0,0,.9); }
  #caption .s { font-size:clamp(13px,1.3vw,16px); color:#c3d0db; line-height:1.8; text-shadow:0 0 12px #000; }
  body.cinema .hud:not(#caption):not(#cine-exit):not(#timeline) { opacity:0; pointer-events:none; }
  body.cinema.idle { cursor:none; }
  #cine-exit { top:18px; right:20px; opacity:0; pointer-events:none; font-size:11.5px; color:var(--sub); padding:7px 12px; }
  body.cinema #cine-exit { opacity:.7; pointer-events:auto; }
  body.cinema.idle #cine-exit { opacity:0; }
  #toast { left:50%; top:42%; transform:translate(-50%,-50%) scale(.96); opacity:0; pointer-events:none; text-align:center; transition:opacity .8s, transform .8s; }
  #toast.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #toast b { display:block; font-size:clamp(28px,4.5vw,54px); font-weight:900; letter-spacing:.04em; background:linear-gradient(90deg,#fff,#9fe8ff 50%,#c3a8ff); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 24px rgba(94,224,255,.45)); }
  #toast span { font-size:13px; letter-spacing:.3em; color:var(--sub); }
  /* 起動 */
  #boot { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:var(--bg); transition:opacity 1.2s; text-align:center; padding:24px; }
  #boot.done { opacity:0; pointer-events:none; }
  #boot .k { font-size:12px; letter-spacing:.5em; color:var(--sub); font-weight:700; }
  #boot .orb { width:10px; height:10px; border-radius:50%; background:#fff; box-shadow:0 0 30px 10px rgba(94,224,255,.7),0 0 80px 30px rgba(181,139,255,.35); animation:breath 1.6s ease-in-out infinite; }
  #boot .msg { font-size:13px; color:var(--sub); line-height:1.9; max-width:520px; }
  #boot.err .orb { background:var(--projects); box-shadow:0 0 30px 8px rgba(255,107,139,.5); animation:none; }
  #boot code { font-family:ui-monospace,Menlo,monospace; background:rgba(255,255,255,.07); padding:1px 6px; border-radius:4px; }
  @keyframes breath { 50% { transform:scale(1.8); opacity:.7; } }
  @media (max-width:1440px) { #tools .b kbd { display:none; } }  /* 「表示」を足した分、ノート PC 幅ではキーの表記を省いて 1 段に収める(キー操作はそのまま効く) */
  @media (max-width:860px) {
    #tools { top:auto; bottom:64px; right:12px; left:12px; max-width:none; justify-content:flex-start; }
    #search { flex:1 1 100%; } #search input, #search input:focus { width:100%; }
    #tools { bottom:62px; padding:6px; gap:6px; } .b { padding:6px 9px; font-size:12px; }
    #brand { top:12px; left:12px; } #hint { display:none; }
    #legend { left:12px; right:12px; bottom:10px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; } #legend button { flex:none; }
    #panel { top:auto; bottom:0; right:0; left:0; width:auto; max-height:52vh; border-radius:16px 16px 0 0; transform:translateY(100%); }
    #timeline { bottom:auto; top:110px; } #caption { left:20px; bottom:30px; }
    .b kbd { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { .hud, #boot { transition:none; } #boot .orb { animation:none; } }
</style>
<!-- three.js は版と中身を固定して読む（integrity。CDN の中身が違えば読み込まず、2D に案内する）。版を上げるときは読む全部のファイルのハッシュを作り直す -->

<body>
<div id="stage"></div>
<div id="labels"></div>

<div class="hud glass" id="brand">
  <div class="k" id="root-name">WIKI</div>
  <h1>Knowledge Cosmos</h1>
  <div class="stats" id="stats"></div>
</div>
<div class="hud glass" id="tools">
  <div id="search"><input id="q" type="search" placeholder="ページを探す（題・要約）" autocomplete="off"><span class="n" id="qn"></span></div>
  <button class="b" id="bt-play" type="button" title="日付の順にページが生まれる様子を再生">▶ 成長を再生 <kbd>Space</kbd></button>
  <button class="b" id="bt-cluster" type="button" title="同じ種類のページを引き寄せる">⦿ 種類で集める <kbd>G</kbd></button>
  <button class="b" id="bt-cine" type="button" title="UI を消して自動で巡回(録画向け)">🎬 シネマ <kbd>C</kbd></button>
  <button class="b" id="bt-fit" type="button" title="全体を映す">⤢ 全体 <kbd>R</kbd></button>
  <select id="top" title="重要度の高いカードだけに絞る(カードが多くて重い時に)"></select>
  <select id="origin" aria-label="出どころ"></select>
  <select id="topic" aria-label="内容カテゴリ"></select>
  <select id="kind" aria-label="知識の種類"></select>
  <a class="b" href="./index.html#/graph" title="依存なしの 2D グラフ">2D</a>
  <a class="b" href="./index.html" title="Wiki の画面に戻る">← Wiki</a>
</div>
<div class="hud glass" id="legend"></div>
<div class="hud glass" id="hint"><b>ドラッグ</b> 回転 · <b>ホイール</b> ズーム · <b>点をつかむ</b> 引っぱる<br><b>クリック</b> 詳細 · <b>/</b> 検索 · <b>Esc</b> 解除 · <b>F</b> 全画面</div>
<aside class="hud glass" id="panel" aria-live="polite"></aside>
<div class="hud glass" id="timeline"><div class="k">KNOWLEDGE GROWTH</div><div class="date" id="tl-date">—</div><div class="count" id="tl-count"></div><div class="bar"><i id="tl-bar"></i></div></div>
<div class="hud" id="caption"><div class="shelf" id="cap-shelf"></div><div class="t" id="cap-title"></div><div class="s" id="cap-sum"></div></div>
<div class="hud glass" id="cine-exit">🎬 シネマ中 · Esc / C で戻る</div>
<div class="hud" id="toast"><b id="toast-b"></b><span id="toast-s"></span></div>
<div id="boot"><div class="orb"></div><div class="k">KNOWLEDGE COSMOS</div><div class="msg">ページを読み込んでいます…</div></div>

<script type="module">
const $ = s => document.querySelector(s);
const pageHref = k => '#/p/' + String(k).split('/').map(encodeURIComponent).join('/');  // キーに % や ? があっても開けるように
const unhash = () => { try { return decodeURIComponent(location.hash.replace(/^#\/p\//, '')); } catch (e) { return ''; } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const PALETTE = { notes:'#5ee0ff', me:'#ffbe3d', v3:'#b58bff', recipes:'#45f0a8', projects:'#ff6b8b', other:'#9fb3c8' };
const STATUS = { active:'進行中', paused:'一時停止', done:'完了', draft:'未確認', confirmed:'確かめた' };
const NOREF = new Set(['paused']);  // 一時停止の案件は暗く描く（未確認＝draft は少しだけ暗く。下の dim）
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const boot = $('#boot');
function fail(html) { boot.classList.add('err'); boot.querySelector('.msg').innerHTML = html; }

main().catch(e => { console.error(e); fail(`3D 表示でエラーが起きました（${esc(e.message)}）。<br><a href="./index.html#/graph">2D のグラフで見る →</a>`); });

async function main() {
  // ---------- データと three.js ----------
  let DATA;
  try {
    const r = await fetch('./index.json', { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
  } catch (e) {

    const drift = REDUCE ? 0 : .8;
    for (const n of nodes) {
      if (n.popT < 1 && n.born) { n.popT = Math.min(1, n.popT + dt / .7); n.scale = n.on && n.popT > 0 ? backOut(n.popT) : 0; }
      else n.scale += ((n.on ? 1 : 0) - n.scale) * Math.min(1, dt * 5);
      n.hl += (n.hlT - n.hl) * Math.min(1, dt * 7);
      n.flash = Math.max(0, n.flash - dt * 1.6);
      n.rx = n.x + Math.sin(T * .55 + n.phase) * drift; n.ry = n.y + Math.cos(T * .47 + n.phase * 1.3) * drift; n.rz = n.z + Math.sin(T * .39 + n.phase * .7) * drift;
      const s = Math.max(1e-4, n.size * n.scale * (1 + n.flash * .55) * (n.i === focusCenter ? 1.25 : 1));
      dummy.position.set(n.rx, n.ry, n.rz); dummy.scale.setScalar(s); dummy.updateMatrix(); coreMesh.setMatrixAt(n.i, dummy.matrix);
      const dim = NOREF.has(n.p.status) ? .3 : (n.p.status === 'draft' ? .6 : .8) + n.imp * .3, b = n.hl * dim;  // 一時停止は暗く、未確認は少し暗く、つながりの多いページほど明るく
      col.copy(n.color).lerp(WHITE, Math.min(.8, .22 + n.flash * .45)).multiplyScalar(Math.min(1.25, b * (1 + n.flash * .5))); coreMesh.setColorAt(n.i, col);
      HP[n.i * 3] = n.rx; HP[n.i * 3 + 1] = n.ry; HP[n.i * 3 + 2] = n.rz;
      HC[n.i * 3] = n.color.r; HC[n.i * 3 + 1] = n.color.g; HC[n.i * 3 + 2] = n.color.b;
      const dc = Math.hypot(n.rx - camera.position.x, n.ry - camera.position.y, n.rz - camera.position.z);
      HS[n.i] = s * Math.min(6.5, Math.max(3, dc / 70));  // 寄るほど光輪を控えめに(大きさ)
      HA[n.i] = Math.min(1.1, (n.halo + n.flash * .6) * b) * Math.min(1, n.scale) * Math.min(1, dc / 260);  // 光輪 = 進行中の案件とつながりが特に多いページ、触れた瞬間だけ。寄った時は薄く（白飛び防止）
    }
    coreMesh.instanceMatrix.needsUpdate = true; coreMesh.instanceColor.needsUpdate = true;
    for (const k of ['position', 'color', 'size', 'alpha']) haloGeo.attributes[k].needsUpdate = true;

    // 線
    if (E) {
      const LP = linePos.array, LC = lineCol.array;
      edges.forEach((e, k) => {
        const a = nodes[e.a], b = nodes[e.b];
        e.hl += (e.hlT - e.hl) * Math.min(1, dt * 7);
        LP.set([a.rx, a.ry, a.rz, b.rx, b.ry, b.rz], k * 6);
        const v = Math.min(a.scale, b.scale, 1) * e.hl * .5 * LINE_K * (NOREF.has(a.p.status) || NOREF.has(b.p.status) ? .45 : 1);
        LC.set([a.color.r * v, a.color.g * v, a.color.b * v, b.color.r * v, b.color.g * v, b.color.b * v], k * 6);
      });
      linePos.needsUpdate = true; lineCol.needsUpdate = true;
    }

    // 信号: 常に少し流れ、注目点からは外へ多めに流れる。届いた先で少し連鎖する
    const live = e => nodes[e.a].on && nodes[e.b].on && nodes[e.a].scale > .5 && nodes[e.b].scale > .5;
    if (E && !tl) {
      spawnAcc += dt * Math.min(E, 800) * (REDUCE ? .03 : .16) * (focusCenter != null || hits ? .35 : 1);  // 線が多くても流す光は増やしすぎない(白飛び防止)
      while (spawnAcc >= 1) { spawnAcc--; const k = Math.floor(Math.random() * E); if (live(edges[k])) spawnPulse(k, Math.random() < .5 ? edges[k].a : edges[k].b, .55); }
      if (focusCenter != null && !REDUCE) {
        const inc = nodes[focusCenter].inc; focusAcc += dt * Math.min(14, 2 + inc.length * 1.4);
        while (focusAcc >= 1 && inc.length) { focusAcc--; const k = inc[Math.floor(Math.random() * inc.length)]; if (live(edges[k])) spawnPulse(k, focusCenter, 1.15); }
      }
    }
    for (let k = 0; k < MAXP; k++) {
      const p = pulses[k];
      if (!p.live) { PS[k] = 0; PA[k] = 0; continue; }
      const e = edges[p.e], a = nodes[p.from], b = nodes[p.from === e.a ? e.b : e.a];
      p.t += dt * p.sp * Math.min(2.2, 34 / Math.max(10, Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z)));
      if (p.t >= 1 || !live(e)) {
        p.live = false; PS[k] = 0; PA[k] = 0;
        if (p.t >= 1) {
          b.flash = Math.min(1, b.flash + .35 * p.str);
          if (p.str > .45 && Math.random() < (p.str > 1 ? .15 : .3)) { const nx = b.inc.filter(j => j !== p.e); if (nx.length) spawnPulse(nx[Math.floor(Math.random() * nx.length)], b.i, p.str * .72); }
        }
        continue;
      }
      const t = p.t, u = 1 - t;
      PP[k * 3] = a.rx * u + b.rx * t; PP[k * 3 + 1] = a.ry * u + b.ry * t; PP[k * 3 + 2] = a.rz * u + b.rz * t;
      col.copy(a.color).lerp(b.color, t).lerp(WHITE, .35);
      PC[k * 3] = col.r; PC[k * 3 + 1] = col.g; PC[k * 3 + 2] = col.b;
      PS[k] = (2.2 + p.str * 2.4); PA[k] = Math.sin(Math.PI * t) ** .6 * Math.min(1.3, p.str) * Math.max(.15, Math.min(a.hl, b.hl, 1.2));
    }
    for (const k of ['position', 'color', 'size', 'alpha']) pulseGeo.attributes[k].needsUpdate = true;

    // 波紋と選択リング(カメラに正対)
    camQ.copy(camera.quaternion);
    for (const r of rings) {
      if (r.t >= 1) { r.m.visible = false; continue; }
      r.t = Math.min(1, r.t + dt / 1.3);
      r.m.position.set(r.n.rx, r.n.ry, r.n.rz); r.m.quaternion.copy(camQ);
      r.m.scale.setScalar(r.n.size * (1.5 + ease(r.t) * 9)); r.m.material.opacity = (1 - r.t) ** 2 * .9;
    }
    const sel = selected ?? (cine ? focusCenter : null);
    selRing.visible = sel != null;
    if (sel != null) {
      const n = nodes[sel];
      selRing.position.set(n.rx, n.ry, n.rz); selRing.quaternion.copy(camQ);
      selRing.scale.setScalar(n.size * 1.25 * (2.1 + Math.sin(T * 3) * .15)); selRing.material.color.copy(n.color).lerp(WHITE, .4);
    }

    // カメラ: 飛行 → 選択中は対象にゆっくり追従 → 放置中は自動回転
    if (fly) {
      fly.t += dt; const k = ease(Math.min(1, fly.t / fly.dur));
      camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.q0, fly.q1, k);
      if (k >= 1) fly = null;
    } else if (selected != null && !cine && dragging == null) {
      const n = nodes[selected], d = new THREE.Vector3(n.rx, n.ry, n.rz).sub(controls.target).multiplyScalar(.06);
      controls.target.add(d); camera.position.add(d);
    }
    controls.autoRotate = !REDUCE && dragging == null && (cine != null || tl != null || T - lastInteract > 6);
    controls.autoRotateSpeed = cine ? .7 : tl ? .9 : .45;
    controls.update();
    scene.userData.stars.uniforms.uTime.value = T;
    scene.userData.dust.rotation.y = T * .006;
    drawLabels();
    composer.render();
    requestAnimationFrame(frame);
  }

  // ---------- 起動: 中心から弾けて広がり、カメラが寄っていく ----------
  refreshOn(); applyFocus();
  nodes.forEach((n, k) => { n.popT = -k * Math.min(.03, 1.2 / N); });
  requestAnimationFrame(frame);
  setTimeout(() => boot.classList.add('done'), 250);
  const deep = unhash();
  fitLater(1500, 2.6);
  autoFit = index.has(deep) ? 0 : 1;
  if (index.has(deep)) setTimeout(() => select(index.get(deep)), 4300);
  addEventListener('hashchange', () => { const k = unhash(); if (index.has(k) && index.get(k) !== selected) select(index.get(k)); });
}
</script>
</body>
</html>
