<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki — ワークスペース</title>
<!-- ============================================================
  tools/wiki-view/index.html — ワークスペースの Wiki の閲覧画面（kote2 Builder AI OS の本体。OS の更新で配る）
  - kote2 Builder v3 の LLM Wiki の閲覧画面（templates/wiki/index.html）を写して、OS の Wiki の項目に合わせたもの。
    Markdown の表示・2D のグラフの計算は v3 のまま。v3 の Wiki にしかないもの（毎日メモ・プロジェクトの並び・昇格候補・棚・スタック）は外した
  - 色と枠は OS の標準テーマ（DESIGN.md。v3 のダッシュボードと同じ抹茶色: 緑の外枠・クリームの地・白い面）。ダークモードとフォントの外からの読み込みはしない。3D（graph.html）は別の見た目のまま
  - 依存なしの単一 HTML。tools/wiki_view.py が返す ./index.json を読んで描く。読む・探す・つながりを眺める専用で、何も書かない
  - 直すのは Sveltia（../admin/）。3D のグラフは ./graph.html（three.js を CDN から読む。オフラインならこの 2D が受け皿）
============================================================ -->
<style>
  /* 標準テーマ（DESIGN.md の Olive Cream = v3 のダッシュボードの抹茶色）。--accent は線・点・大きな数字用、小さな文字の色は --link・--warn-ink */
  :root {
    --frame:#71804b; --bg:#f0efe2; --surface:#fff; --text:#2f3a1c; --sub:#5a6242;
    --accent:#71804b; --accent-soft:#dde0c8; --line:#d9dcc3; --link:#4b6b2a; --dark:#333f1f;
    --ok:#4b6b2a; --ok-bg:#e6ead4; --warn:#b05c2e; --warn-ink:#8f4521; --warn-bg:#f6e9de;
    --info:#5a6242; --info-bg:#e9ead9; --callout-bg:#fbf9ee; --code-bg:#f6f5ea; --radius:10px;
    /* 種類の色（2D のグラフの点・カードの上の線・凡例）。地のクリームとの差が 3:1 以上 */
    --c-notes:#71804b; --c-projects:#b05c2e; --c-recipes:#333f1f; --c-me:#a0721f; --c-v3:#7d6b58; --c-other:#8c8878;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif; background:var(--frame); color:var(--text); font-size:15px; line-height:1.8; }
  a { color:var(--link); }
  .layout { display:flex; min-height:calc(100vh - 36px); margin:18px; background:var(--bg); }
  aside { width:300px; flex:none; background:var(--surface); border-right:1px solid var(--line); position:sticky; top:18px; height:calc(100vh - 36px); overflow-y:auto; padding:28px 22px; display:flex; flex-direction:column; gap:20px; }
  .brand h1 { font-size:20px; font-weight:900; line-height:1.35; letter-spacing:.01em; overflow-wrap:anywhere; }
  .brand h1 span { display:block; font-size:11px; color:var(--sub); font-weight:700; letter-spacing:.14em; margin-top:4px; }
  .brand .tagline { font-size:13px; color:var(--sub); margin-top:10px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { display:inline-block; font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--text); text-decoration:none; cursor:pointer; font-family:inherit; }
  .btn:hover { background:var(--accent-soft); }
  .btn.primary { background:var(--dark); color:#fff; border-color:var(--dark); }
  .btn.primary:hover { background:#46552b; }
  .btn:focus-visible, .tile:focus-visible, nav a:focus-visible, .card:focus-visible { outline:2px solid var(--dark); outline-offset:2px; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile { border:1px solid var(--line); border-radius:var(--radius); padding:11px 12px 8px; cursor:pointer; text-decoration:none; color:inherit; display:block; }
  .tile:hover { background:var(--accent-soft); }
  .tile b { display:block; font-size:25px; font-weight:900; color:var(--accent); line-height:1.25; font-feature-settings:"tnum"; }
  .tile span { font-size:11.5px; color:var(--sub); }
  .search input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:13px; background:var(--bg); color:var(--text); }
  .search input:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
  nav { display:flex; flex-direction:column; }
  nav .lbl { font-size:11px; color:var(--sub); letter-spacing:.08em; margin:6px 10px 2px; }
  nav a { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 10px; border-radius:8px; color:var(--text); text-decoration:none; font-size:13.5px; font-weight:500; }
  nav a:hover, nav a.on { background:var(--accent-soft); }
  nav a .n { font-size:11px; color:var(--sub); background:var(--bg); border:1px solid var(--line); border-radius:99px; padding:0 8px; font-feature-settings:"tnum"; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .side-foot { margin-top:auto; font-size:11.5px; color:var(--sub); line-height:1.8; border-top:1px solid var(--line); padding-top:12px; }
  main { flex:1; min-width:0; padding:34px 40px 72px; max-width:1180px; }
  section { margin-bottom:44px; }
  .sec-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .sec-head .dot { width:10px; height:10px; border-radius:3px; background:var(--accent); flex:none; align-self:center; }
  h2 { font-size:16px; font-weight:700; letter-spacing:.04em; }
  .sec-head .count { font-size:12px; font-weight:700; color:var(--sub); background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:0 9px; }
  .sec-head .hint { margin-left:auto; font-size:12.5px; color:var(--sub); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); border-top:3px solid var(--accent); padding:14px 16px; display:flex; flex-direction:column; gap:7px; text-decoration:none; color:inherit; }
  .card:hover { border-color:var(--accent); }
  .topic-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  .topic-grid a { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); color:var(--text); text-decoration:none; font-weight:700; }
  .topic-grid a:hover { border-color:var(--accent); }
  .topic-grid .n { color:var(--sub); font-size:12px; white-space:nowrap; }
  .topic-grid .lbl { grid-column:1/-1; color:var(--sub); font-size:12px; }
  .card.notes { border-top-color:var(--c-notes); } .card.projects { border-top-color:var(--c-projects); } .card.v3 { border-top-color:var(--c-v3); } .card.recipes { border-top-color:var(--c-recipes); } .card.me { border-top-color:var(--c-me); } .card.other { border-top-color:var(--c-other); }
  .card .name { font-weight:700; font-size:14.5px; line-height:1.5; }
  .card .desc { font-size:13px; color:var(--sub); flex:1; }
  .card .meta { font-size:11.5px; color:var(--sub); font-feature-settings:"tnum"; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; }
  .badge { font-size:11px; font-weight:700; border-radius:99px; padding:1px 9px; white-space:nowrap; text-decoration:none; }
  .badge.gray { color:var(--sub); background:var(--code-bg); }
  .st-active { color:var(--warn-ink); background:var(--warn-bg); } .st-done,.st-confirmed { color:var(--ok); background:var(--ok-bg); } .st-draft { color:var(--info); background:var(--info-bg); } .st-paused,.st-none { color:var(--sub); background:var(--code-bg); }
  .badge.star { color:var(--warn-ink); background:var(--warn-bg); }
  .notice { border:1px solid var(--warn); border-left:6px solid var(--warn); background:var(--callout-bg); color:var(--text); border-radius:var(--radius); padding:12px 16px; font-size:13.5px; margin-bottom:22px; }
  .notice b { color:var(--warn-ink); }
  .badge.up { color:var(--link); background:var(--accent-soft); }
  .empty { grid-column:1/-1; border:1px dashed var(--line); border-radius:var(--radius); padding:26px; text-align:center; color:var(--sub); font-size:13.5px; }
  /* ページ表示 */
  .page { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:28px 32px; }
  .page .crumbs { font-size:12.5px; color:var(--sub); margin-bottom:8px; }
  .crumbs-top { font-size:12.5px; color:var(--sub); margin:0 0 10px 2px; }
  .sec-head .acts { display:flex; gap:8px; align-items:center; margin-left:12px; }  /* 欄の右上のボタン(開く系は目立つ色 = btn primary) */
  .sec-head .acts.solo { margin-left:auto; }
  .page.has-corner { position:relative; } .page.has-corner h1 { padding-right:150px; }
  .page .corner { position:absolute; top:24px; right:28px; display:flex; gap:8px; }
  .page h1 { font-size:22px; font-weight:900; line-height:1.4; margin-bottom:6px; }
  .page .summary { color:var(--sub); font-size:14px; margin-bottom:14px; }
  .page .metabar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:18px; }
  .page .metabar .k { font-size:11.5px; color:var(--sub); margin-left:6px; }
  .tri { display:grid; gap:10px; margin:14px 0 20px; }
  .tri .b { border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:8px; padding:10px 14px; background:var(--bg); font-size:14px; }
  .tri .b.cause { border-left-color:var(--info); } .tri .b.fix { border-left-color:var(--ok); }
  .tri .b b { display:block; font-size:11.5px; color:var(--sub); letter-spacing:.06em; margin-bottom:2px; }
  .md { font-size:14.5px; }
  .md h1,.md h2,.md h3 { margin:20px 0 8px; line-height:1.5; } .md h1{font-size:19px} .md h2{font-size:17px; border-bottom:1px solid var(--line); padding-bottom:4px} .md h3{font-size:15px}
  .md p { margin:8px 0; } .md ul,.md ol { margin:8px 0 8px 22px; } .md li { margin:2px 0; }
  .md code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; background:var(--code-bg); padding:1px 6px; border-radius:4px; }
  .md pre { background:var(--code-bg); border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow-x:auto; margin:10px 0; }
  .md pre code { background:none; padding:0; font-size:12.5px; line-height:1.6; }
  .md blockquote { border-left:4px solid var(--line); color:var(--sub); padding:2px 14px; margin:10px 0; }
  .md table { border-collapse:collapse; width:100%; margin:10px 0; font-size:13.5px; display:block; overflow-x:auto; }
  .md th,.md td { border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top; }
  .md th { background:var(--accent-soft); }
  .kv { display:grid; grid-template-columns:120px 1fr; gap:4px 12px; font-size:13px; margin-top:22px; padding-top:14px; border-top:1px solid var(--line); }
  .kv dt { color:var(--sub); } .kv dd { word-break:break-all; }
  .kv a.ref { display:inline-block; margin-right:8px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
  .toolbar select,.toolbar input[type="search"] { font:inherit; font-size:12.5px; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--text); max-width:100%; }
  /* Graph View: related だけを線にする。タグ / スタックは接続を過剰に増やさない */
  .graph-shell { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .graph-tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 14px; border-bottom:1px solid var(--line); }
  .graph-tools input[type="search"] { min-width:220px; flex:1; }
  .graph-tools label { font-size:12.5px; color:var(--sub); display:flex; align-items:center; gap:5px; }
  .graph-tools .graph-stats { margin-left:auto; font-size:12px; color:var(--sub); font-feature-settings:"tnum"; }
  .graph-stage { position:relative; height:min(68vh,650px); min-height:440px; background:var(--bg); overflow:hidden; touch-action:none; }
  .graph-stage svg { width:100%; height:100%; display:block; user-select:none; }
  .graph-edge { stroke:var(--sub); stroke-opacity:.25; stroke-width:1.2; vector-effect:non-scaling-stroke; }
  .graph-edge.lit { stroke:var(--warn); stroke-opacity:.9; stroke-width:2.2; }  /* 触れた点の線 */
  .graph-node { cursor:pointer; outline:none; }
  svg.inspecting .graph-node.labeled:not(:hover):not(:focus) text { opacity:0; }
  svg.inspecting .graph-edge:not(.lit) { stroke-opacity:.07; }
  svg.inspecting .graph-node:not(.peer):not(:hover):not(:focus) circle { opacity:.3; }
  .graph-node circle { fill:var(--c-notes); stroke:var(--surface); stroke-width:2.2; vector-effect:non-scaling-stroke; transition:stroke-width .12s,opacity .12s; }
  .graph-node.projects circle { fill:var(--c-projects); } .graph-node.v3 circle { fill:var(--c-v3); }
  .graph-node.recipes circle { fill:var(--c-recipes); } .graph-node.me circle { fill:var(--c-me); } .graph-node.other circle { fill:var(--c-other); }
  .graph-node.paused { opacity:.42; } .graph-node.draft circle { fill-opacity:.6; }
  .graph-node.important circle { stroke:var(--dark); stroke-width:3.4; }
  .graph-node.isolate circle { stroke-dasharray:3 3; }
  .graph-node.peer circle { stroke:var(--warn); stroke-width:3.4; }  /* 触れた点の相手 */
  .graph-band rect { fill:var(--surface); fill-opacity:.55; stroke:var(--sub); stroke-opacity:.45; stroke-dasharray:5 5; stroke-width:1.2; vector-effect:non-scaling-stroke; }  /* 孤立の帯(薄い面 + 破線の枠 + 見出し) */
  .graph-band text { fill:var(--sub); font-size:14px; font-weight:700; letter-spacing:.06em; }
  .graph-node:hover circle,.graph-node:focus circle { stroke:var(--text); stroke-width:3.5; }
  .graph-node text { fill:var(--text); font-size:13px; font-weight:650; paint-order:stroke; stroke:var(--bg); stroke-width:3px; stroke-linejoin:round; pointer-events:none; opacity:0; }
  .graph-node.labeled text,.graph-node:hover text,.graph-node:focus text { opacity:1; }
  .graph-detail { min-height:46px; padding:9px 14px; border-top:1px solid var(--line); color:var(--sub); font-size:12.5px; }
  .graph-detail b { color:var(--text); }
  .graph-legend { display:flex; flex-wrap:wrap; gap:10px 14px; padding:9px 14px; border-top:1px solid var(--line); font-size:11.5px; color:var(--sub); }
  .graph-legend span { display:inline-flex; align-items:center; gap:5px; }
  .graph-legend i { width:9px; height:9px; border-radius:50%; background:var(--c-notes); }
  .graph-legend .projects { background:var(--c-projects); } .graph-legend .v3 { background:var(--c-v3); }
  .graph-legend .recipes { background:var(--c-recipes); } .graph-legend .me { background:var(--c-me); } .graph-legend .other { background:var(--c-other); }
  body.no3d .to-3d { display:none; }  /* graph.html を置いていない(3D を切った)時は入口を出さない */
  .md hr { border:0; border-top:1px solid var(--line); margin:14px 0; }
  @media (max-width:1180px) { .dash3 { grid-template-columns:1fr; } }
  .graph-empty { display:flex; align-items:center; justify-content:center; height:100%; color:var(--sub); font-size:13px; }
  @media (max-width:820px) { .layout{flex-direction:column; margin:10px; min-height:calc(100vh - 20px)} aside{width:auto; height:auto; position:static; border-right:0; border-bottom:1px solid var(--line)} main{padding:22px 16px 60px} .page{padding:20px 18px} }
  @media print { body{background:#fff} .layout{margin:0} aside{position:static; height:auto} }
  @media (max-width:620px) { .graph-stage{min-height:390px;height:60vh}.graph-tools input[type="search"]{min-width:100%}.graph-tools .graph-stats{margin-left:0;width:100%} }
  .project-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:20px 0; border-bottom:1px solid var(--line); padding-bottom:12px; }
  .project-tabs button { font:inherit; padding:10px 18px; border:1px solid var(--dark); border-radius:8px; background:var(--surface); color:var(--text); cursor:pointer; }
  .project-tabs button[aria-selected="true"] { background:var(--dark); color:var(--surface); }
  .project-tabs button:focus-visible { outline:3px solid var(--dark); outline-offset:3px; }
  .page.project-page { background:var(--bg); border:0; padding:0; }
  .project-panel { overflow-wrap:anywhere; }
  .project-section { margin:0 0 24px; padding:20px; background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--frame); border-radius:var(--radius); min-width:0; }
  .project-section > :first-child { margin-top:0; }
  .project-section table { margin-bottom:0; }
  .project-table { overflow-x:auto; max-width:100%; }
  .project-table table { display:table; width:100%; }
  .proposal-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr)); gap:14px; }
  .proposal-card { padding:18px; background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--frame); border-radius:var(--radius); overflow-wrap:anywhere; }
  .proposal-card strong { display:block; margin-bottom:8px; }
  .proposal-card p:last-child { background:var(--accent-soft); border-radius:6px; padding:8px 12px; }
  .project-section:has(.proposal-grid) { background:transparent; border:0; padding:0; }
  @media print { .project-tabs { display:none; } .project-panel[hidden] { display:block; } }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">
      <h1>Wiki<span id="brand">ワークスペース</span></h1>
      <div class="tagline">このワークスペースの記録（wiki/）とレシピ。読む・探す・つながりを見るはここ、直すは Sveltia。</div>
    </div>
    <div class="actions">
      <a class="btn primary" href="../admin/index.html" target="_blank" rel="noopener">✎ 直す（Sveltia）</a>
      <a class="btn to-3d" href="./graph.html">✦ 3D</a>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="search"><input id="q" type="search" placeholder="検索（題・要約・本文）"></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <main id="main"><div class="empty">読み込み中…</div></main>
</div>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const STATUS = { active:'進行中', paused:'一時停止', done:'完了', draft:'未確認', confirmed:'確かめた' };
  let DATA = null, COL = {}, BYKEY = {}, BYPATH = {}, CUR = null;  // CUR = いま開いているページ（相対リンクを解く起点）
  const arr = v => Array.isArray(v) ? v.map(String) : (typeof v === 'string' && v ? [v] : []);  // 壊れた値でも落ちない
  const normalize = p => { p.collection = p.role || p.collection; p.related = arr(p.related); p.tags = arr(p.tags); p.importance = Number.isFinite(p.importance) ? p.importance : 0; p.important = p.important === true; p.fm = p.fm && typeof p.fm === 'object' ? p.fm : {}; return p; };
  const context = p => [p.kind_label, p.origin === 'v3' ? '出どころ: v3' : '', p.previous_status ? `v3での状態: ${p.previous_status}（現在への適用確認とは別）` : ''].filter(Boolean).join(' · ');
  const facets = (id, field, title) => `<select id="${id}" aria-label="${title}"><option value="">${title}: すべて</option>${[...new Set(DATA.pages.map(p => p[field]).filter(Boolean))].sort().map(value => `<option value="${esc(value)}">${esc(field === 'origin' ? (value === 'v3' ? 'v3の記録' : 'OS利用後の記録') : DATA.pages.find(p => p[field] === value).kind_label)}</option>`).join('')}</select>`;

  const knowledge = p => p.collection === 'notes' && !p.navigation;
  const topicMatch = (p, value) => !value || (knowledge(p) && (value === ':none' ? !p.os_topic_state && !arr(p.os_topics).length : value === ':pending' ? p.os_topic_state === 'pending' : p.os_topic_state === 'classified' && arr(p.os_topics).includes(value)));
  const topicOptions = () => `<option value="">内容カテゴリ: すべて</option>${(DATA.topics || []).map(topic => `<option value="${esc(topic.id)}">${esc(topic.title)} (${topic.count})</option>`).join('')}<option value=":none">カテゴリなし</option><option value=":pending">確認待ち</option>`;
  const topicFacet = id => `<select id="${id}" aria-label="内容カテゴリ">${topicOptions()}</select>`;
  const topicLinks = p => arr(p.os_topics).map(identifier => (DATA.topics || []).find(topic => topic.id === identifier)).filter(Boolean).map(topic => `<a href="#/t/${encodeURIComponent(topic.id)}">${esc(topic.title)}</a>`).join(' · ') || (p.os_topic_state === 'pending' ? '確認待ち' : 'カテゴリなし');
  function topicNavigation() {
    const items = DATA.pages.filter(knowledge);

  function projectBody(body) {

        const scroll = document.createElement('div'); scroll.className = 'project-table'; scroll.tabIndex = 0; scroll.setAttribute('role', 'region'); scroll.setAttribute('aria-label', '案件の表（横にスクロールできます）');

  function search(q) {

    render(true);
  }
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = e.target.value.trim(); location.hash = v ? `#/q/${encodeURIComponent(v)}` : '#/'; } });
  window.addEventListener('hashchange', event => {
    const samePage = event.oldURL.split('?')[0] === event.newURL.split('?')[0];
    render(samePage);
    if (samePage) document.querySelector('[role="tab"][aria-selected="true"]')?.focus();
  });
  window.addEventListener('focus', () => { if (DATA && location.hash.replace(/^#\/?/, '').split('/')[0] !== 'graph') load(); });  // タブに戻ったら最新に（Sveltia で直したあと）。グラフは動かしている途中なので読み直さない
  load();
})();
</script>
</body>
</html>
